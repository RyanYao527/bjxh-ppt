name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-pptx lxml pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: QA — audit_demo
        run: python scripts/qa.py examples/audit_demo.pptx

      - name: QA — xxb_report
        run: python scripts/qa.py examples/xxb_2025_2026_report.pptx
