name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-pptx lxml pytest

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check scripts/ tests/ --ignore=E501,F811

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy scripts/ --ignore-missing-imports --check-untyped-defs || true

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: QA — audit_demo
        run: python scripts/qa.py examples/audit_demo.pptx

      - name: QA — xxb_report
        run: python scripts/qa.py examples/xxb_2025_2026_report.pptx

      - name: E2E regenerate (skipped on CI, requires master template)
        if: false
        run: python scripts/from_outline.py examples/audit_demo.md /tmp/test.pptx examples/audit_demo.pptx --no-chapter-covers
