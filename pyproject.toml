[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short"]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
