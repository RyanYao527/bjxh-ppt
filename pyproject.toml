[project]
name = "bjxh-ppt"
version = "2.0.0"
description = "北京兴华会计师事务所 PPT 制作规范 — Markdown 大纲 → 品牌合规 .pptx"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.0",
    "lxml",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short"]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
